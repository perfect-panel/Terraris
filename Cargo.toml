[package]
name = "terraris"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "PPanel node foundation with a Polaris-inspired control plane"
license = "GPL-3.0-only"
publish = false

[dependencies]
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
ipnet = "2.12"
regex = "1.13"
aho-corasick = "1.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1.0.11"
rustls-pemfile = "2.2"
aes = "0.8.4"
aes-gcm = "0.10.3"
base64 = "0.22"
chacha20poly1305 = "0.10.1"
ctr = "0.9.2"
getrandom = "0.4"
ml-kem = { version = "0.3.2", features = ["zeroize"] }
subtle = "2.6"
uuid = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
bytes = "1.12.1"
futures-util = "0.3.34"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1"
url = "2"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3"

[dev-dependencies]
rcgen = "0.14.10"
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
