[panel]
# Includes any reverse-proxy API prefix; HTTPS is recommended for deployment.
base_url = "https://panel.example.com"
server_id = 1
secret_env = "TERRARIS_PANEL_SECRET"
# Alternatively, remove secret_env and set secret_file (relative to this file).
# secret_file = "panel.secret"
wire_format = "auto" # auto, json, protobuf
timeout_seconds = 30
max_response_bytes = 67108864
max_request_bytes = 8388608

[node]
# Protocol ports, users and Encryption settings are supplied by PPanel.
listen = "0.0.0.0"
# Without Encryption, use a trusted loopback transport or explicitly opt in.
allow_plaintext = false
memory_bytes = 67108864
buffer_slots = 16384
connection_memory_bytes = 4194304
connection_buffer_slots = 256
max_connections = 4096
max_handshakes = 128
max_xudp_sessions = 32
max_xudp_associations = 1024
xudp_resume_timeout_seconds = 60
xudp_detached_packets = 8
queue_packets = 32
user_max_age_seconds = 900
handshake_timeout_seconds = 10
idle_timeout_seconds = 300
udp_idle_timeout_seconds = 60
drain_timeout_seconds = 30
shutdown_timeout_seconds = 5

# Upstream addresses and domain routing come from PPanel's dns/outbound fields.
[dns]
cache_entries = 1024
cache_bytes = 8388608
concurrency = 64
max_waiters = 4096
timeout_seconds = 5
max_ttl_seconds = 86400
negative_ttl_seconds = 300
max_answers = 64
intercept = true
# ca_file = "dns-ca.pem" # extra roots, relative to this file
# [dns.bootstrap]
# "resolver.example.com" = ["127.0.0.1"] # replace with your resolver's real address

[routing]
# Required only when a rule references that data file. Replace assets atomically.
# geosite = "geosite.dat"
# geoip = "geoip.dat"
# outbound_ca_file = "proxy-ca.pem"

[routing.limits]
max_rules = 1024
max_selectors = 500000
max_selector_bytes = 67108864
max_regex = 256
regex_bytes = 1048576
max_categories = 128
asset_bytes = 134217728
